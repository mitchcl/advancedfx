name: Build AfxHookSource x64 (mirv_pgl patch)

on:
  push:
    branches: [mirv-pgl-x64]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - uses: MinoruSekine/setup-scoop@v4

      - name: Install gettext
        run: scoop install gettext

      - name: Ensure Rust x64 msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Configure (x64-release)
        run: cmake --preset x64-release

      - name: Build AfxHookSource (x64-release)
        run: cmake --build --preset x64-release --target AfxHookSource

      - name: Locate build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== AfxHookSource.dll matches ==="
          Get-ChildItem -Recurse -Filter AfxHookSource.dll -ErrorAction SilentlyContinue build | Select-Object FullName, Length
          Write-Host "=== all dlls under build ==="
          Get-ChildItem -Recurse -Filter *.dll -ErrorAction SilentlyContinue build | Select-Object FullName

      - name: Upload AfxHookSource.dll
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource-x64
          path: build/x64-release/**/AfxHookSource.dll
          if-no-files-found: error
