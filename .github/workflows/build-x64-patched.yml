name: Build AfxHookSource x64 (mirv_pgl patch)

on:
  push:
    branches: [mirv-pgl-x64]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - uses: MinoruSekine/setup-scoop@v4

      - name: Install gettext
        run: scoop install gettext

      - name: Ensure Rust targets
        run: rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc

      - name: Build (MultiBuild staging, x64 = Source 1 family)
        run: cmake -DAFX_MULTIBUILD_STAGING=ON -DAFX_MULTIBUILD_STAGING_X64=source1 -P cmake/MultiBuild.cmake

      - name: Locate build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== AfxHookSource.dll matches ==="
          Get-ChildItem -Recurse -Filter AfxHookSource.dll -ErrorAction SilentlyContinue build | Select-Object FullName, Length
          Write-Host "=== staging-release tree ==="
          if (Test-Path build/staging-release) { Get-ChildItem -Recurse build/staging-release | Select-Object FullName }

      - name: Upload AfxHookSource.dll
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource-x64
          path: build/staging-release/**/AfxHookSource.dll
          if-no-files-found: error
